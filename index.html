<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Papelão</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login">
  <img src="logo.svg" class="logo" alt="Logo do Papelão">
  <h1>Papelão</h1>
  <p>A rede social de 3 pessoas. Sim, três.</p>
  <div id="perfis"></div>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN (dica: é 1234)">
  <button id="entrar" class="main">Entrar</button>
  <p id="err"></p>
</section>

<main id="app" hidden>
  <header><img src="logo.svg" alt=""><b>Papelão</b><button id="sair">Sair</button></header>
  <div id="feed"></div>
  <button id="novo" class="main fab">+ Postar</button>
</main>

<aside id="drawer" hidden>
  <div class="sheet">
    <div class="top"><b>Comentários</b><button id="fechar">Fechar</button></div>
    <ul id="clist"></ul>
    <div class="row"><input id="ctexto" placeholder="Escreve algo (sê simpático, são só 3)"><button id="cenviar" class="main">Enviar</button></div>
  </div>
</aside>

<div id="modal" hidden>
  <div class="sheet">
    <div class="top"><b>Novo post</b><button id="mfechar">Cancelar</button></div>
    <textarea id="mtexto" maxlength="140" placeholder="O que se passa na tua cabeça? (140 letras)"></textarea>
    <label>Cor do fundo <input id="mhue" type="range" min="0" max="360" value="280"></label>
    <label>Vídeo (opcional, só dura até fechares o separador) <input id="mvideo" type="file" accept="video/*"></label>
    <button id="mpostar" class="main">Publicar</button>
  </div>
</div>

<div id="toast"></div>

<script src="storage.js"></script>
<script src="data.js"></script>
<script src="auth.js"></script>
<script src="feed.js"></script>
<script src="comments.js"></script>
<script src="upload.js"></script>
<script src="app.js"></script>
</body>
</html>
